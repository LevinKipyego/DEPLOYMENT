services:

  ###########################################################
  # PostgreSQL (Billing Database)
  ###########################################################

  postgres_main:
    image: postgis/postgis:17-3.5

    container_name: postgres_main

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC

    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c maintenance_work_mem=64MB
      -c work_mem=4MB
      -c max_connections=200
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # - ./backups/postgres:/backups

    networks:
      - backend

    mem_limit: 512m
    cpus: 0.70

    stop_signal: SIGINT
    stop_grace_period: 90s

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"



  ###########################################################
  # MySQL (FreeRADIUS)
  ###########################################################

  mysql_main:
    image: mysql:8.0

    container_name: mysql_main

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC

    mem_limit: 1280m
    mem_reservation: 512m
    cpus: 1.50

    command: >
      --max_connections=200
      --innodb-buffer-pool-size=512M
      --max_allowed_packet=256M
      --innodb-log-file-size=64M
      --innodb-flush-method=O_DIRECT

    volumes:
      - mysql_data:/var/lib/mysql
      - ../DJANGO_BILLING/mysql-init:/docker-entrypoint-initdb.d:ro
      # - ./backups/mysql:/backups

    networks:
      - backend

    stop_signal: SIGTERM
    stop_grace_period: 90s

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"




  ###########################################################
  # Redis
  ###########################################################

  redis:
    image: redis:7-alpine
    container_name: redis

    restart: unless-stopped

    init: true

    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    networks:
      - backend

    mem_limit: 160m
    cpus: 0.25

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"




  ###########################################################
  # Django + Uvicorn
  ###########################################################

  web:
    build:
      context: ../DJANGO_BILLING
      dockerfile: docker/django/Dockerfile

    container_name: django_web

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      TZ: UTC
      PYTHONUNBUFFERED: "1"
    
    depends_on:
      postgres_main:
        condition: service_healthy
      mysql_main:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
    - gunicorn
    - config.asgi:application
    - -k
    - uvicorn.workers.UvicornWorker
    - --bind
    - 0.0.0.0:8000
    - --workers
    - "2"
    - --worker-tmp-dir
    - /dev/shm
    - --keep-alive
    - "30"
    - --max-requests
    - "1000"
    - --max-requests-jitter
    - "100"
    - --graceful-timeout
    - "30"
    - --timeout
    - "120"
    - --access-logfile
    - "-"
    - --error-logfile
    - "-"
    - --log-level
    - info

    expose:
      - "8000"

    networks:
      - backend

    mem_limit: 768m
    cpus: 1.0

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    stop_signal: SIGTERM
    stop_grace_period: 60s

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready/').getcode() == 200 else 1)\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    volumes:
      - static_volume:/code/staticfiles
      - media_volume:/code/media


  ###########################################################
  # Celery Worker
  ###########################################################

  celery:
    build:
      context: ../DJANGO_BILLING
      dockerfile: docker/django/Dockerfile

    container_name: celery_worker

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      TZ: UTC
      PYTHONUNBUFFERED: "1"

    depends_on:
      postgres_main:
        condition: service_healthy

      mysql_main:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=1
      --prefetch-multiplier=1
      --max-tasks-per-child=500
      --without-gossip
      --without-mingle

    networks:
      - backend

    mem_limit: 512m
    cpus: 0.50

    stop_grace_period: 60s

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp

    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "config",
          "inspect",
          "ping"
        ]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"



  ###########################################################
  # Celery Beat
  ###########################################################

  celery-beat:
    build:
      context: ../DJANGO_BILLING
      dockerfile: docker/django/Dockerfile

    container_name: celery_beat

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: config.settings.production

    depends_on:
      postgres_main:
        condition: service_healthy

      mysql_main:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: >
      celery -A config beat
      --loglevel=info
      --pidfile=
      --schedule=/tmp/celerybeat-schedule

    networks:
      - backend

    tmpfs:
      - /tmp

    mem_limit: 256m
    cpus: 0.25

    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; exit(0 if os.path.exists('/tmp/celerybeat-schedule') else 1)"
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"



  ###########################################################
  # NGINX Reverse Proxy
  ###########################################################

  nginx:
    build:
      context: ./nginx

    container_name: nginx

    restart: unless-stopped

    depends_on:
      web:
        condition: service_healthy

      frontend:
        condition: service_healthy

    ports:
      - "80:80"
      

    mem_limit: 64m
    cpus: 0.25

    volumes:
      - static_volume:/static:ro
      - media_volume:/media:ro

      # Let's Encrypt
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    networks:
      - backend

    logging:
      options:
        max-size: "20m"
        max-file: "5"



  ###########################################################
  # React Frontend (Vite + Nginx)
  ###########################################################

  frontend:
    build:
      context: ../BILLING_frontend_react
      dockerfile: DockerFile
      args:
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_WS_BASE: ${VITE_WS_BASE}
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_ENV: ${VITE_ENV}

    container_name: frontend

    restart: unless-stopped

    init: true

    depends_on:
      web:
        condition: service_healthy

    expose:
      - "80"

    networks:
      - backend

    mem_limit: 128m
    cpus: 0.25

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

###########################################################
# Volumes
###########################################################

volumes:

  postgres_data:

  mysql_data:

  redis_data:

  static_volume:

  media_volume:





###########################################################
# Network
###########################################################

networks:

  backend:
    driver: bridge