services:

  ###########################################################
  # PostgreSQL (Billing Database)
  ###########################################################

  postgres_main:
    image: postgis/postgis:17-3.5

    container_name: postgres_main

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC

    command: >
      postgres
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c work_mem=2MB
      -c max_connections=60
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # - ./backups/postgres:/backups

    networks:
      - backend

    mem_limit: 384m
    mem_reservation: 256m
    cpus: 0.60

    stop_signal: SIGINT
    stop_grace_period: 90s

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



  ###########################################################
  # MySQL (FreeRADIUS)
  ###########################################################

  mysql_main:
    image: mysql:8.0

    container_name: mysql_main

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC

    mem_limit: 768m
    mem_reservation: 512m
    cpus: 1.00

    command: >
      --max_connections=80
      --innodb-buffer-pool-size=384M
      --max_allowed_packet=64M
      --innodb-redo-log-capacity=128M
      --innodb-flush-method=O_DIRECT
      --tmp_table_size=32M
      --max_heap_table_size=32M
      --thread_cache_size=16

    volumes:
      - mysql_data:/var/lib/mysql
      - ../DJANGO_BILLING/mysql-init:/docker-entrypoint-initdb.d:ro
      # - ./backups/mysql:/backups

    networks:
      - backend

    stop_signal: SIGTERM
    stop_grace_period: 90s

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"




  ###########################################################
  # Redis
  ###########################################################

  redis:
    image: redis:7-alpine
    container_name: redis

    restart: unless-stopped

    init: true

    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 96mb
      --maxmemory-policy noeviction

    volumes:
      - redis_data:/data

    networks:
      - backend

    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.20

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"




  ###########################################################
  # Django + Uvicorn
  ###########################################################

  web:
    build:
      context: ../DJANGO_BILLING
      dockerfile: docker/django/Dockerfile

    container_name: django_web

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      TZ: UTC
      PYTHONUNBUFFERED: "1"
    
    depends_on:
      postgres_main:
        condition: service_healthy
      mysql_main:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
    - gunicorn
    - config.asgi:application
    - -k
    - uvicorn.workers.UvicornWorker
    - --bind
    - 0.0.0.0:8000
    - --workers
    - "2"
    - --worker-tmp-dir
    - /dev/shm
    - --keep-alive
    - "30"
    - --max-requests
    - "1000"
    - --max-requests-jitter
    - "100"
    - --graceful-timeout
    - "30"
    - --timeout
    - "120"
    - --access-logfile
    - "-"
    - --error-logfile
    - "-"
    - --log-level
    - info

    expose:
      - "8000"

    networks:
      - backend

    mem_limit: 576m
    mem_reservation: 320m
    cpus: 0.90

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    stop_signal: SIGTERM
    stop_grace_period: 60s

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready/').getcode() == 200 else 1)\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - static_volume:/code/staticfiles
      - media_volume:/code/media


  ###########################################################
  # Celery Worker
  ###########################################################

  celery:
    build:
      context: ../DJANGO_BILLING
      dockerfile: docker/django/Dockerfile

    container_name: celery_worker

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      TZ: UTC
      PYTHONUNBUFFERED: "1"

    depends_on:
      postgres_main:
        condition: service_healthy

      mysql_main:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: >
      celery -A config worker
      --loglevel=info
      --pool=prefork
      --concurrency=1
      --prefetch-multiplier=1
      --max-tasks-per-child=100
      --max-memory-per-child=280000
      --without-gossip
      --without-mingle

    networks:
      - backend

    mem_limit: 448m
    mem_reservation: 192m
    cpus: 0.50

    stop_grace_period: 60s

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:size=64m,mode=1777

    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "config",
          "inspect",
          "ping"
        ]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



  ###########################################################
  # Celery Beat
  ###########################################################

  celery-beat:
    build:
      context: ../DJANGO_BILLING
      dockerfile: docker/django/Dockerfile

    container_name: celery_beat

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: config.settings.production

    depends_on:
      postgres_main:
        condition: service_healthy

      mysql_main:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: >
      celery -A config beat
      --loglevel=info
      --pidfile=/tmp/celerybeat.pid
      --schedule=/var/lib/celery/celerybeat-schedule

    networks:
      - backend

    tmpfs:
      - /tmp:size=16m,mode=1777

    volumes:
      - celerybeat_data:/var/lib/celery

    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.15

    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



  ###########################################################
  # NGINX Reverse Proxy
  ###########################################################

  nginx:
    build:
      context: ./nginx

    container_name: nginx

    restart: unless-stopped

    depends_on:
      web:
        condition: service_healthy

      frontend:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"
      

    mem_limit: 96m
    mem_reservation: 32m
    cpus: 0.20

    volumes:
      - static_volume:/static:ro
      - media_volume:/media:ro

      # Let's Encrypt
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    networks:
      - backend

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  

  ###########################################################
  # Initial Certificate Request
  ###########################################################

  certbot-init:
    image: certbot/certbot

    profiles:
      - tools

    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    entrypoint: certbot

    networks:
      - backend

  ###########################################################
  # React Frontend (Vite + Nginx)
  ###########################################################

  frontend:
    build:
      context: ../BILLING_frontend_react
      dockerfile: DockerFile
      args:
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_WS_BASE: ${VITE_WS_BASE}
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_ENV: ${VITE_ENV}

    container_name: frontend

    restart: unless-stopped

    init: true

    depends_on:
      web:
        condition: service_healthy

    expose:
      - "80"

    networks:
      - backend

    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.20

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=8m,mode=1777
      - /tmp:size=16m,mode=1777

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


###########################################################
#RADIUS SERVER
############################################################

  radius:
    build:
      context: ../DJANGO_BILLING/freeradius
      dockerfile: Dockerfile

    container_name: freeradius

    restart: unless-stopped

    init: true

    depends_on:
      mysql_main:
        condition: service_healthy

    env_file:
      - .env

    environment:
      TZ: Africa/Nairobi

      RADIUS_DB_HOST: ${MYSQL_HOST}
      RADIUS_DB_PORT: ${MYSQL_PORT}
      RADIUS_DB_NAME: ${MYSQL_DATABASE}
      RADIUS_DB_USER: ${MYSQL_USER}
      RADIUS_DB_PASSWORD: ${MYSQL_PASSWORD}

    
      

    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"

    networks:
      - backend

    mem_limit: 320m
    mem_reservation: 128m
    cpus: 0.50

    stop_signal: SIGTERM
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "pgrep freeradius >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5


    # -------------------------
    # Log Rotation (Prevents Full Disk)
    # -------------------------
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

###########################################################
# Volumes
###########################################################

volumes:

  postgres_data:

  mysql_data:

  redis_data:

  static_volume:

  media_volume:

  celerybeat_data:



###########################################################
# Network
###########################################################

networks:

  backend:
    driver: bridge