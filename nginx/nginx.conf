# ==========================================================
# Upstream React Frontend
# ==========================================================

upstream frontend {
    server frontend:80;
    keepalive 32;
}

# ==========================================================
# Upstream Django
# ==========================================================

upstream django {
    server web:8000;
    keepalive 32;
}

# ==========================================================
# WebSocket Connection Upgrade
# ==========================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ==========================================================
# Rate Limiting
# ==========================================================

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ==========================================================
# Server
# ==========================================================

server {

    listen 80;
    server_name veegostems.com www.veegostems.com;

    server_tokens off;

    client_max_body_size 100M;

    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ======================================================
    # Compression
    # ======================================================

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ======================================================
    # Security Headers
    # ======================================================

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP can be enabled later after frontend testing.
    # add_header Content-Security-Policy "...";


     ###########################################################
    # Let's Encrypt Challenge
    ###########################################################

    location /.well-known/acme-challenge/ {

        root /var/www/certbot;

    }

    # ======================================================
    # Static Files (Django)
    # ======================================================

    location /static/ {

        alias /static/;

        access_log off;

        expires 30d;

        add_header Cache-Control "public, immutable";
    }

    # ======================================================
    # Media Files (Django)
    # ======================================================

    location /media/ {

        alias /media/;

        access_log off;

        expires 7d;
    }

    # ======================================================
    # Health Endpoint
    # ======================================================

    location /api/health/ {

        proxy_pass http://django;

        access_log off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================================
    # Django REST API
    # ======================================================

    location /api/ {

        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://django;

        proxy_http_version 1.1;

        proxy_redirect off;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ======================================================
    # Django Admin
    # ======================================================

    location /admin/ {

        proxy_pass http://django;

        proxy_http_version 1.1;

        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================================
    # WebSockets (Django Channels)
    # ======================================================

    location /ws/ {

        proxy_pass http://django;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ======================================================
    # React Frontend
    # ======================================================

    location / {

        proxy_pass http://frontend;

        proxy_http_version 1.1;

        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================================
    # Deny Hidden Files
    # ======================================================

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

}

'''
# ==========================================================
# Upstream React Frontend
# ==========================================================
upstream frontend {
    server frontend:80;
    keepalive 32;
}

# ==========================================================
# Upstream Django
# ==========================================================
upstream django {
    server web:8000;
    keepalive 32;
}

# ==========================================================
# WebSocket Upgrade
# ==========================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ==========================================================
# Rate Limiting
# ==========================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

############################################################
# HTTP (80)
############################################################

server {

    listen 80;
    server_name veegostems.com www.veegostems.com;

    client_max_body_size 100M;

    ########################################################
    # Let's Encrypt Challenge
    ########################################################

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    ########################################################
    # Redirect everything else to HTTPS
    ########################################################

    location / {
        return 301 https://$host$request_uri;
    }
}

############################################################
# HTTPS (443)
############################################################

server {

    listen 443 ssl http2;
    server_name veegostems.com www.veegostems.com;

    ########################################################
    # Let's Encrypt Challenge
    ########################################################

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    server_tokens off;

    ########################################################
    # SSL
    ########################################################

    ssl_certificate /etc/letsencrypt/live/veegostems.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veegostems.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ########################################################
    # Logging
    ########################################################

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    ########################################################
    # Compression
    ########################################################

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    ########################################################
    # Security Headers
    ########################################################

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    ########################################################
    # Static Files
    ########################################################

    location /static/ {

        alias /static/;

        access_log off;

        expires 30d;

        add_header Cache-Control "public, immutable";
    }

    ########################################################
    # Media Files
    ########################################################

    location /media/ {

        alias /media/;

        access_log off;

        expires 7d;
    }

    ########################################################
    # Health Endpoint
    ########################################################

    location /api/health/ {

        proxy_pass http://django;

        access_log off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    ########################################################
    # Django API
    ########################################################

    location /api/ {

        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://django;

        proxy_http_version 1.1;

        proxy_redirect off;

        proxy_buffering on;

        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    ########################################################
    # Django Admin
    ########################################################

    location /admin/ {

        proxy_pass http://django;

        proxy_http_version 1.1;

        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    ########################################################
    # WebSockets
    ########################################################

    location /ws/ {

        proxy_pass http://django;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    ########################################################
    # React Frontend
    ########################################################

    location / {

        proxy_pass http://frontend;

        proxy_http_version 1.1;

        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    ########################################################
    # Deny Hidden Files
    ########################################################

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
